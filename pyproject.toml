[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "land-emissions-monitor"
version = "0.1.0"
description = "Land industrial emissions monitor: detection, attribution and alerts from satellite data."
requires-python = ">=3.11,<3.12"
# Only what the code imports today; new dependencies are added with the code that uses them.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "geoalchemy2>=0.15",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "apscheduler>=3.10,<4",
  "pyproj>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "tests"]
addopts = "-ra"
markers = [
  "db: needs a reachable PostGIS database (DATABASE_URL); skipped otherwise",
  "live: needs real services and credentials; skipped unless RUN_LIVE=1",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
