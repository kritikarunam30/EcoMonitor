# Thresholds, weights and schedule (docs/IMPLEMENTATION_PLAN.md §0.10).
# Secrets and per-machine values live in .env; user-facing text lives in config/wording.yaml.
# Values are tuned only through the decision gates (plan §0.9), never to make a test pass.

region:
  name: singrauli
  bbox: [82.0, 23.6, 83.4, 24.8]       # lon_min, lat_min, lon_max, lat_max — verify in Phase S
  geojson: config/regions/singrauli.geojson
registry:
  cluster_radius_km: 15
  dedupe_threshold: 0.75
  dedupe_max_km: 3
detect:
  local_radius_km: 5
  null_annulus_km: [20, 50]
  null_mask_km: 15            # exclude null buffers near any registered facility
  n_null: 40
  n_null_min_valid: 20
  z_bg_min: 2.0
  valid_fraction_min: 0.5
  cloud_max: 0.3
  aer_ai_degraded: 1.0
  self_min_days: 20
  self_season_days: 45
  self_trailing_days: 90
  z_self_min: 2.0
  so2_window_days: 28
  so2_min_valid_days: 10
  so2_boot: 200
flaring:
  source: firms_persistent       # annual_sites | firms_persistent | nightfire (nightfire needs a licence)
  radius_km: 2
  min_nights: 3
  window_days: 30
  min_frp_mw: 5                  # firms_persistent only; tune from the spike's real counts
  nightfire_temp_k: 1400         # nightfire only
  annual_site_match_km: 1        # a detection within this distance of an annual flare site is flagged known_flare_site
wind:
  # Gate G1 (2026-10-10): ERA5 100 m for history, read from Earth Engine first and from the CDS second;
  # GFS 10 m for the last days, which ERA5 does not cover yet; ERA5-Land 10 m as the fallback.
  chain: [era5_100m_ee, cds_era5_100m, gfs_ee, era5_land_10m_ee]
  level: 100m
  uncertainty_frac: {era5_100m_ee: 0.25, cds_era5_100m: 0.25, gfs_ee: 0.30, era5_land_10m_ee: 0.35}
  min_speed_ms: 1.5
  max_speed_ms: 10
  gfs_max_offset_hours: 3        # gfs_ee has analyses at run hours only; the nearest one within this answers (not in plan §0.10)
attribute:
  cone_half_angle_deg: 30
  transport_hours: 3
  cone_max_km: 50
  margin_min: 0.25
fusion:
  event_gap_hours: 48
  corroboration_bonus: 0.05
  corroboration_max: 0.10
  score_cap: 0.95
  burn_prob_min: 0.6
  burn_frp_min_mw: 50
  burn_window_hours: 24
score:
  weights: {signal_quality: 1.0, attribution_certainty: 1.0, anomaly_strength: 1.0}
  neutral_anomaly: 0.5
emission:
  wind_min_ms: 2
  wind_max_ms: 8
  min_days: 60
  n_boot: 200
  boot_block_days: 7
  across_km: 20
  nox_no2_ratio: 1.32
  seasons: {DJF: [12, 1, 2], MAM: [3, 4, 5], SON: [10, 11]}   # JJAS monsoon excluded
  reference_match_km: 10
baseline:
  train_end: 2024-12-31
  valid_year: 2025
  rolling_z_days: 60
  alert_z: 3.0
  alert_k: 2
  alert_n: 5
  alert_calendar_days: 14
  known_event_pad_days: 7
impact:
  wedge_half_angle_deg: 15
  wedge_max_km: 30
  decay_km: 15
thermal:
  ship_margin_f1: 0.03
schedule:
  daily_tz: Asia/Kolkata
  daily_time: "15:00"
  rerun_previous_days: 10        # gate G1: offline NO2 arrives about 9 days late (plan default was 5)
  firms_every_hours: 3
  emission_refresh: monthly
  heartbeat_minutes: 10        # worker liveness log (not in plan §0.10)
alerts:
  max_watchlists_per_email: 5
  max_watchlists_per_ip_per_day: 20
  demo_auto_confirm: false
# Data access (Phase 2; not in plan §0.10). Asset ids and bands are in config/sources.yaml.
data:
  ee_chunk_days: 20              # days stacked into one Earth Engine pixel request
  s2_search_days: 5              # a Sentinel-2 chip may be this many days from the requested date
  s2_max_cloud_pct: 20
  ndvi_window_days: 15
  ndvi_scale_m: 100
  worldcover_scale_m: 100
  overpass_timeout_s: 180
# Map layers served as tiles: display range and palette per layer (Phase 2; tuned in Phase 11).
layers:
  no2: {min: 0.0, max: 0.0004, palette: ["#000004", "#51127c", "#b73779", "#fc8961", "#fcfdbf"]}
  so2: {min: 0.0, max: 0.001, palette: ["#000004", "#51127c", "#b73779", "#fc8961", "#fcfdbf"]}
  ch4: {min: 1850, max: 1950, palette: ["#440154", "#3b528b", "#21918c", "#5ec962", "#fde725"]}
  aer_ai: {min: -1.0, max: 2.0, palette: ["#2166ac", "#f7f7f7", "#b2182b"]}
